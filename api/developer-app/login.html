<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login do Desenvolvedor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/developer/assets/styles.css">
</head>
<body class="developer-auth-body">
  <main class="developer-auth-shell">
    <section class="developer-auth-card">
      <p class="eyebrow">Area do desenvolvedor</p>
      <h1>Entrar</h1>
      <p class="developer-auth-copy">Use a senha do portal para acessar os ESPs e publicar atualizacoes.</p>

      <form id="developerLoginForm" class="developer-auth-form">
        <label class="field">
          <span>Senha</span>
          <input id="developerPasswordInput" type="password" autocomplete="current-password" placeholder="Digite a senha">
        </label>

        <button type="submit">Entrar</button>
      </form>

      <p class="hint" id="developerLoginHint">A senha e configurada no backend da API.</p>
    </section>
  </main>

  <script type="module" src="/developer/assets/login.js"></script>
</body>
</html>
